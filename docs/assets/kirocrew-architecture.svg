<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">KiroCrew runtime architecture</title>
  <desc id="desc">Docker Desktop hosts shared tooling, two isolated Kiro agents, persistent homes, and a shared project tree.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#132c46"/>
    </linearGradient>
    <linearGradient id="agentA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d4f"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="agentB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263664"/>
      <stop offset="1" stop-color="#344b85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#78a7c7"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#62d6c7"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#background)"/>
  <path d="M0 132H1400M0 590H1400" stroke="#24425e" stroke-width="1" opacity=".65"/>
  <circle cx="1260" cy="-30" r="260" fill="#62d6c7" opacity=".07"/>
  <circle cx="80" cy="760" r="300" fill="#8bb8ff" opacity=".06"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="66" fill="#f8fafc" font-size="34" font-weight="700">KiroCrew runtime architecture</text>
    <text x="70" y="98" fill="#a9bfd3" font-size="17">Docker Desktop / WSL2 · isolated agents · persistent state · localhost dashboards</text>

    <text x="70" y="164" fill="#78a7c7" font-size="13" font-weight="700" letter-spacing="2">SHARED TOOLING</text>
    <text x="70" y="618" fill="#78a7c7" font-size="13" font-weight="700" letter-spacing="2">PERSISTENT STORAGE</text>

    <g filter="url(#shadow)">
      <rect x="70" y="190" width="190" height="82" rx="16" fill="#26344b" stroke="#fbbf24" stroke-width="2"/>
      <rect x="290" y="190" width="220" height="82" rx="16" fill="#153d4c" stroke="#62d6c7" stroke-width="2"/>
      <rect x="540" y="190" width="190" height="82" rx="16" fill="#26344b" stroke="#8bb8ff" stroke-width="2"/>
      <rect x="760" y="190" width="190" height="82" rx="16" fill="#26344b" stroke="#8bb8ff" stroke-width="2"/>
      <rect x="980" y="190" width="260" height="82" rx="16" fill="#26344b" stroke="#fbbf24" stroke-width="2"/>
    </g>

    <text x="95" y="225" fill="#f8fafc" font-size="20" font-weight="700">Docker Desktop</text>
    <text x="95" y="250" fill="#bad0df" font-size="14">Linux engine + WSL2</text>
    <text x="315" y="225" fill="#f8fafc" font-size="20" font-weight="700">kirocrew-net</text>
    <text x="315" y="250" fill="#bad0df" font-size="14">shared bridge network</text>
    <text x="565" y="225" fill="#f8fafc" font-size="20" font-weight="700">docker-cli</text>
    <text x="565" y="250" fill="#bad0df" font-size="14">one-shot tool volume</text>
    <text x="785" y="225" fill="#f8fafc" font-size="20" font-weight="700">node-cli</text>
    <text x="785" y="250" fill="#bad0df" font-size="14">Node + Playwright</text>
    <text x="1005" y="225" fill="#f8fafc" font-size="20" font-weight="700">gh-cli</text>
    <text x="1005" y="250" fill="#bad0df" font-size="14">GitHub CLI credentials stay local</text>

    <path d="M260 231H288M510 231H538M730 231H758M950 231H978" stroke="#78a7c7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="45" y="310" width="1310" height="242" rx="24" fill="#071827" stroke="#315673" stroke-width="2" stroke-dasharray="8 9"/>
    <text x="72" y="344" fill="#78a7c7" font-size="13" font-weight="700" letter-spacing="2">AGENT RUNTIME</text>

    <g filter="url(#shadow)">
      <rect x="100" y="370" width="500" height="140" rx="20" fill="url(#agentA)" stroke="#62d6c7" stroke-width="2"/>
      <rect x="800" y="370" width="500" height="140" rx="20" fill="url(#agentB)" stroke="#8bb8ff" stroke-width="2"/>
    </g>

    <circle cx="135" cy="405" r="9" fill="#62d6c7"/>
    <text x="160" y="412" fill="#f8fafc" font-size="26" font-weight="700">Kiro A</text>
    <text x="160" y="443" fill="#d3e5ed" font-size="16">kiro-a-config → gateway</text>
    <text x="160" y="475" fill="#d3e5ed" font-size="16">dashboard :5476 · ACP session</text>
    <text x="160" y="500" fill="#62d6c7" font-size="13">healthy · localhost only</text>

    <circle cx="835" cy="405" r="9" fill="#8bb8ff"/>
    <text x="860" y="412" fill="#f8fafc" font-size="26" font-weight="700">Kiro B</text>
    <text x="860" y="443" fill="#d3e1ef" font-size="16">kiro-b-config → gateway</text>
    <text x="860" y="475" fill="#d3e1ef" font-size="16">dashboard :5477 · ACP session</text>
    <text x="860" y="500" fill="#8bb8ff" font-size="13">healthy · localhost only</text>

    <path d="M395 272V366M855 272V366" stroke="#62d6c7" stroke-width="3" marker-end="url(#arrowAccent)"/>
    <path d="M620 272V335H350V366M620 272V335H1050V366" stroke="#78a7c7" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="100" y="650" width="500" height="70" rx="16" fill="#251c45" stroke="#b99aff" stroke-width="2"/>
      <rect x="800" y="650" width="500" height="70" rx="16" fill="#251c45" stroke="#b99aff" stroke-width="2"/>
    </g>
    <text x="130" y="681" fill="#f8fafc" font-size="20" font-weight="700">kiro-a-home</text>
    <text x="130" y="705" fill="#d9ccff" font-size="14">named volume · /home/kirocrew</text>
    <text x="830" y="681" fill="#f8fafc" font-size="20" font-weight="700">kiro-b-home</text>
    <text x="830" y="705" fill="#d9ccff" font-size="14">named volume · /home/kirocrew</text>

    <path d="M350 510V646M1050 510V646" stroke="#b99aff" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
    <path d="M600 440H800" stroke="#62d6c7" stroke-width="2" stroke-dasharray="5 8"/>

    <text x="70" y="744" fill="#8da8bf" font-size="14">Host project tree → /home/kirocrew/projects · credentials remain in local env/volumes</text>
  </g>
</svg>
