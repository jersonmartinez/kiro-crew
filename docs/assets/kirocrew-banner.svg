<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">KiroCrew local agent workspace</title>
  <desc id="desc">Two isolated Kiro agents connected to shared Docker, Node, GitHub, and Google Cloud tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1f3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62d6c7"/>
      <stop offset="1" stop-color="#8bb8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1210" cy="-20" r="260" fill="#62d6c7" opacity=".08"/>
  <circle cx="90" cy="420" r="250" fill="#8bb8ff" opacity=".08"/>
  <path d="M410 210H990" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 14" opacity=".8"/>
  <g filter="url(#shadow)">
    <rect x="70" y="74" width="430" height="272" rx="22" fill="#162337" stroke="#62d6c7" stroke-width="2"/>
    <rect x="970" y="74" width="360" height="272" rx="22" fill="#162337" stroke="#8bb8ff" stroke-width="2"/>
    <rect x="550" y="126" width="300" height="168" rx="20" fill="#0c1422" stroke="#425b7c" stroke-width="2"/>
  </g>
  <g fill="#62d6c7">
    <circle cx="104" cy="108" r="8"/><circle cx="130" cy="108" r="8"/><circle cx="156" cy="108" r="8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f8fafc">
    <text x="96" y="164" font-size="36" font-weight="700">KiroCrew</text>
    <text x="96" y="204" font-size="20" fill="#b9c9dc">Local agent workspace</text>
    <text x="96" y="252" font-size="17" fill="#d3e1ef">Docker Desktop · WSL2 · Compose</text>
    <text x="96" y="286" font-size="17" fill="#d3e1ef">Persistent, isolated, localhost-only</text>
    <text x="590" y="172" font-size="22" font-weight="700">Shared tooling</text>
    <text x="590" y="210" font-size="16" fill="#b9c9dc">Docker  ·  Node  ·  GitHub</text>
    <text x="590" y="238" font-size="16" fill="#b9c9dc">Google Cloud  ·  OpenSSH</text>
    <text x="590" y="274" font-size="14" fill="#62d6c7">kirocrew-net</text>
    <text x="1012" y="158" font-size="24" font-weight="700">Agents</text>
    <rect x="1012" y="184" width="276" height="48" rx="12" fill="#21435a"/>
    <rect x="1012" y="248" width="276" height="48" rx="12" fill="#293b68"/>
    <text x="1032" y="215" font-size="18">Kiro A  ·  :5476</text>
    <text x="1032" y="279" font-size="18">Kiro B  ·  :5477</text>
  </g>
  <text x="70" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9fb3ca">Secure-by-default local development bootstrap</text>
</svg>
