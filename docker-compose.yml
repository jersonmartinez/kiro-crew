services:
  docker-cli:
    image: docker:cli
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /docker-bin/cli-plugins /docker-profile
        cp /usr/local/bin/docker /docker-bin/docker
        cp /usr/local/libexec/docker/cli-plugins/docker-compose /docker-bin/cli-plugins/docker-compose
        printf '%s\n' 'export PATH="/opt/docker-cli:/opt/node-cli/bin:/opt/gh-cli:/home/kirocrew/.local/bin:$${PATH}"' > /docker-profile/docker-cli.sh
    volumes:
      - docker-bin:/docker-bin
      - docker-profile:/docker-profile

  node-cli:
    image: node:22-slim
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /node-bin/bin /node-bin/lib
        cp /usr/local/bin/node /node-bin/bin/node
        cp -a /usr/local/lib/node_modules /node-bin/lib/
        ln -sf ../lib/node_modules/npm/bin/npm-cli.js /node-bin/bin/npm
        ln -sf ../lib/node_modules/npm/bin/npx-cli.js /node-bin/bin/npx
        ln -sf ../lib/node_modules/corepack/dist/corepack.js /node-bin/bin/corepack
    volumes:
      - node-bin:/node-bin

  gh-cli:
    image: debian:trixie-slim
    command:
      - /bin/sh
      - -ec
      - |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gh >/dev/null
        install -D -m 0755 /usr/bin/gh /gh-bin/gh
    volumes:
      - gh-bin:/gh-bin

  make:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile.make
    working_dir: /workspace
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-kiro-crew}
      PROJECTS_BASE: ${PROJECTS_BASE}
      PROJECT_PROFILE: ${PROJECT_PROFILE:-dev}
      KIROCREW_MASK_DIRS: ${KIROCREW_MASK_DIRS:-}
      KIROCREW_MASK_MAX_DEPTH: ${KIROCREW_MASK_MAX_DEPTH:-4}
      KIROCREW_MASK_TMPFS_SIZE: ${KIROCREW_MASK_TMPFS_SIZE:-1g}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${PROJECTS_BASE}
        target: /workspace/projects
        read_only: true
    networks:
      - kirocrew-net

  kiro-a-config:
    image: ${KIROCREW_RUNTIME_IMAGE:-kirocrew-local:latest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -x "$${HOME}/.local/bin/kiro-cli" ]; then
          curl -fsSL https://cli.kiro.dev/install | bash
        fi
        kirocrew setup --agent-only
        kirocrew config set knowledge.max_sources "$${KIROCREW_KNOWLEDGE_MAX_SOURCES}"
        kirocrew config set knowledge.extraction_pool_size "$${KIROCREW_KNOWLEDGE_EXTRACTION_POOL_SIZE}"
        kirocrew config set knowledge.folder_ingest_chunk_budget "$${KIROCREW_KNOWLEDGE_FOLDER_CHUNK_BUDGET}"
        # Git identity + GitHub credential helper for this instance (ADR-010).
        # Written into the persistent home volume, so it survives restarts and
        # never has to be re-run manually. `gh` itself needs no `auth login`:
        # it authenticates from GH_TOKEN on every invocation.
        # Remove any stale manually-created gh host config so it cannot shadow
        # the per-instance token injected via the environment.
        rm -f /home/kirocrew/.config/gh/hosts.yml
        git config --global --replace-all user.name "$${GIT_USER_NAME}"
        git config --global --replace-all user.email "$${GIT_USER_EMAIL}"
        git config --global --replace-all credential."https://github.com".helper "!/opt/gh-cli/gh auth git-credential"
        git config --global --replace-all safe.directory '*'
        if kiro-cli whoami >/dev/null 2>&1; then
          touch "$${KIROCREW_HOME}/.kiro_cli_setup_complete"
        fi
    environment:
      HOME: /home/kirocrew
      KIRO_HOME: /home/kirocrew/.kiro
      KIROCREW_HOME: /home/kirocrew/.kiro/crew
      KIROCREW_KNOWLEDGE_MAX_SOURCES: ${KIROCREW_KNOWLEDGE_MAX_SOURCES:-100}
      KIROCREW_KNOWLEDGE_EXTRACTION_POOL_SIZE: ${KIROCREW_KNOWLEDGE_EXTRACTION_POOL_SIZE:-1}
      KIROCREW_KNOWLEDGE_FOLDER_CHUNK_BUDGET: ${KIROCREW_KNOWLEDGE_FOLDER_CHUNK_BUDGET:-25}
      GIT_USER_NAME: ${GH_USER_A:-kiro-a}
      GIT_USER_EMAIL: ${GH_EMAIL_A:-${GH_USER_A:-kiro-a}@users.noreply.github.com}
    volumes:
      - kiro-a-home:/home/kirocrew

  kiro-b-config:
    image: ${KIROCREW_RUNTIME_IMAGE:-kirocrew-local:latest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -x "$${HOME}/.local/bin/kiro-cli" ]; then
          curl -fsSL https://cli.kiro.dev/install | bash
        fi
        kirocrew setup --agent-only
        kirocrew config set knowledge.max_sources "$${KIROCREW_KNOWLEDGE_MAX_SOURCES}"
        kirocrew config set knowledge.extraction_pool_size "$${KIROCREW_KNOWLEDGE_EXTRACTION_POOL_SIZE}"
        kirocrew config set knowledge.folder_ingest_chunk_budget "$${KIROCREW_KNOWLEDGE_FOLDER_CHUNK_BUDGET}"
        # Git identity + GitHub credential helper for this instance (ADR-010).
        # Written into the persistent home volume, so it survives restarts and
        # never has to be re-run manually. `gh` itself needs no `auth login`:
        # it authenticates from GH_TOKEN on every invocation.
        # Remove any stale manually-created gh host config so it cannot shadow
        # the per-instance token injected via the environment.
        rm -f /home/kirocrew/.config/gh/hosts.yml
        git config --global --replace-all user.name "$${GIT_USER_NAME}"
        git config --global --replace-all user.email "$${GIT_USER_EMAIL}"
        git config --global --replace-all credential."https://github.com".helper "!/opt/gh-cli/gh auth git-credential"
        git config --global --replace-all safe.directory '*'
        if kiro-cli whoami >/dev/null 2>&1; then
          touch "$${KIROCREW_HOME}/.kiro_cli_setup_complete"
        fi
    environment:
      HOME: /home/kirocrew
      KIRO_HOME: /home/kirocrew/.kiro
      KIROCREW_HOME: /home/kirocrew/.kiro/crew
      KIROCREW_KNOWLEDGE_MAX_SOURCES: ${KIROCREW_KNOWLEDGE_MAX_SOURCES:-100}
      KIROCREW_KNOWLEDGE_EXTRACTION_POOL_SIZE: ${KIROCREW_KNOWLEDGE_EXTRACTION_POOL_SIZE:-1}
      KIROCREW_KNOWLEDGE_FOLDER_CHUNK_BUDGET: ${KIROCREW_KNOWLEDGE_FOLDER_CHUNK_BUDGET:-25}
      GIT_USER_NAME: ${GH_USER_B:-kiro-b}
      GIT_USER_EMAIL: ${GH_EMAIL_B:-${GH_USER_B:-kiro-b}@users.noreply.github.com}
    volumes:
      - kiro-b-home:/home/kirocrew

  kiro-a:
    image: ${KIROCREW_RUNTIME_IMAGE:-kirocrew-local:latest}
    build:
      context: .
      dockerfile: Dockerfile.kirocrew
      args:
        BASE_IMAGE: ${KIROCREW_IMAGE}
    hostname: kiro-a
    container_name: kiro-a
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      docker-cli:
        condition: service_completed_successfully
      node-cli:
        condition: service_completed_successfully
      gh-cli:
        condition: service_completed_successfully
      kiro-a-config:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KIRO_A_PORT:-5476}:5476"
    environment:
      KIROCREW_BIND: 0.0.0.0
      KIRO_HOME: /home/kirocrew/.kiro
      KIROCREW_HOME: /home/kirocrew/.kiro/crew
      TZ: ${TZ}
      PATH: /opt/docker-cli:/opt/node-cli/bin:/opt/gh-cli:/home/kirocrew/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      NODE_PATH: /opt/node-cli/lib/node_modules
      # Per-instance GitHub identity (ADR-010). gh reads GH_TOKEN on every
      # invocation, so there is no `gh auth login` state to lose on restart.
      # GH_TOKEN is not in kiro-crew's agent-denied env list, so the agent's own
      # subprocesses inherit it and can drive gh/git without extra setup.
      GH_TOKEN: ${GH_TOKEN_A:-}
      GH_HOST: github.com
      KIROCREW_ALLOW_UNSANDBOXED: ${KIROCREW_ALLOW_UNSANDBOXED:-1}
      KIROCREW_ACP_INIT_TIMEOUT_SECS: ${KIROCREW_ACP_INIT_TIMEOUT_SECS:-120}
    volumes:
      - kiro-a-home:/home/kirocrew
      - docker-bin:/opt/docker-cli:ro
      - docker-bin:/usr/local/libexec/docker:ro
      - docker-profile:/etc/profile.d:ro
      - node-bin:/opt/node-cli:ro
      - gh-bin:/opt/gh-cli:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_BASE}:/home/kirocrew/projects
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    labels:
      com.kirocrew.role: ai-agent
      com.kirocrew.instance: kiro-a
      com.kirocrew.version: stable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5476/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kirocrew-net

  kiro-b:
    image: ${KIROCREW_RUNTIME_IMAGE:-kirocrew-local:latest}
    build:
      context: .
      dockerfile: Dockerfile.kirocrew
      args:
        BASE_IMAGE: ${KIROCREW_IMAGE}
    hostname: kiro-b
    container_name: kiro-b
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      docker-cli:
        condition: service_completed_successfully
      node-cli:
        condition: service_completed_successfully
      gh-cli:
        condition: service_completed_successfully
      kiro-b-config:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KIRO_B_PORT:-5477}:5476"
    environment:
      KIROCREW_BIND: 0.0.0.0
      KIRO_HOME: /home/kirocrew/.kiro
      KIROCREW_HOME: /home/kirocrew/.kiro/crew
      TZ: ${TZ}
      PATH: /opt/docker-cli:/opt/node-cli/bin:/opt/gh-cli:/home/kirocrew/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      NODE_PATH: /opt/node-cli/lib/node_modules
      # Per-instance GitHub identity (ADR-010).
      GH_TOKEN: ${GH_TOKEN_B:-}
      GH_HOST: github.com
      KIROCREW_ALLOW_UNSANDBOXED: ${KIROCREW_ALLOW_UNSANDBOXED:-1}
      KIROCREW_ACP_INIT_TIMEOUT_SECS: ${KIROCREW_ACP_INIT_TIMEOUT_SECS:-120}
    volumes:
      - kiro-b-home:/home/kirocrew
      - docker-bin:/opt/docker-cli:ro
      - docker-bin:/usr/local/libexec/docker:ro
      - docker-profile:/etc/profile.d:ro
      - node-bin:/opt/node-cli:ro
      - gh-bin:/opt/gh-cli:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_BASE}:/home/kirocrew/projects
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    labels:
      com.kirocrew.role: ai-agent
      com.kirocrew.instance: kiro-b
      com.kirocrew.version: stable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5476/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kirocrew-net

networks:
  kirocrew-net:
    name: kirocrew-net
    driver: bridge

volumes:
  kiro-a-home:
    name: kiro-a-home
  kiro-b-home:
    name: kiro-b-home
  docker-bin:
  docker-profile:
  node-bin:
  gh-bin:
