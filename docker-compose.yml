services:
  docker-cli:
    image: docker:cli
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /docker-bin/cli-plugins
        cp /usr/local/bin/docker /docker-bin/docker
        cp /usr/local/libexec/docker/cli-plugins/docker-compose /docker-bin/cli-plugins/docker-compose
    volumes:
      - docker-bin:/docker-bin

  kirocrew:
    image: ${KIROCREW_IMAGE}
    hostname: kirocrew
    container_name: kirocrew
    init: true
    restart: unless-stopped
    depends_on:
      docker-cli:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DASHBOARD_PORT}:5476"
    environment:
      KIROCREW_BIND: 0.0.0.0
      TZ: ${TZ}
      PATH: /opt/docker-cli:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - kirocrew-home:/home/kirocrew
      - docker-bin:/opt/docker-cli:ro
      - docker-bin:/usr/local/libexec/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The directory is available as /home/kirocrew/projects/<project-name>.
      - ${PROJECTS_BASE}:/home/kirocrew/projects
      # For least-privilege access, replace the directory mount with explicit project binds.
    cap_add:
      - SYS_ADMIN
    # Docker Desktop exposes the socket as root:root by default in WSL2.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    labels:
      com.kirocrew.role: ai-agent
      com.kirocrew.version: stable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5476/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  kirocrew-home:
    name: kirocrew-home
  docker-bin:
