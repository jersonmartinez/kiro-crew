name: Update KiroCrew image

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-kirocrew-image
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/kirodotdev/kirocrew
  IMAGE_CHANNEL: insider
  UPDATE_BRANCH: chore/update-kirocrew-insider

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}:${IMAGE_CHANNEL}"
          digest="$(docker buildx imagetools inspect --format '{{json .}}' "$image_ref" | jq -er '.manifest.digest')"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          echo "${image_ref} -> ${digest}"

      - name: Stop when the pinned digest is current
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^KIROCREW_IMAGE=.*@//p' .env.example)"
          if [[ "$current" == "${{ steps.image.outputs.digest }}" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The repository already pins the current image digest.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Updating ${current} to ${{ steps.image.outputs.digest }}"
          fi

      - name: Prepare update branch
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$UPDATE_BRANCH"
            git switch --create "$UPDATE_BRANCH" --track "origin/$UPDATE_BRANCH"
          else
            git switch --create "$UPDATE_BRANCH"
          fi

      - name: Pin the resolved digest
        if: steps.compare.outputs.changed == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.env.example')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          updated = []
          replaced = False
          for line in lines:
              if line.startswith('KIROCREW_IMAGE='):
                  repository = line.split('=', 1)[1].split('@', 1)[0]
                  updated.append(f'{repository}@{os.environ["IMAGE_DIGEST"]}\n')
                  replaced = True
              else:
                  updated.append(line)
          if not replaced:
              raise SystemExit('KIROCREW_IMAGE is missing from .env.example')
          path.write_text(''.join(updated), encoding='utf-8')
          PY

      - name: Validate the update
        if: steps.compare.outputs.changed == 'true'
        run: |
          ./tests/validate.sh
          docker compose --env-file .env.example config --quiet

      - name: Build the updated runtime image
        if: steps.compare.outputs.changed == 'true'
        run: docker compose --env-file .env.example build --pull kiro-a kiro-b

      - name: Enforce runtime image size budget
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          size="$(docker image inspect kirocrew-local:latest --format '{{.Size}}')"
          max=4000000000
          echo "Runtime image size: ${size} bytes; budget: ${max} bytes"
          test "$size" -le "$max"

      - name: Verify the runtime version and tools
        if: steps.compare.outputs.changed == 'true'
        run: |
          docker run --rm --entrypoint kirocrew kirocrew-local:latest --version
          docker run --rm --entrypoint /bin/sh kirocrew-local:latest -ec '
            set -eu
            command -v gcloud >/dev/null
            command -v kubectl >/dev/null
            command -v gke-gcloud-auth-plugin >/dev/null
            command -v ssh >/dev/null
          '

      - name: Create the update commit
        if: steps.compare.outputs.changed == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example
          git commit -m "chore: update KiroCrew insider image to ${IMAGE_DIGEST#sha256:}"
          git push --set-upstream origin "$UPDATE_BRANCH"

      - name: Open or update the pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr comment "$existing" --body "Automated validation completed for \\`${IMAGE_REPOSITORY}:${IMAGE_CHANNEL}@${IMAGE_DIGEST}\\`."
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: update KiroCrew insider image" \
              --body "$(cat <<EOF
          ## Summary
          - Pin the latest \\`${IMAGE_REPOSITORY}:${IMAGE_CHANNEL}\\` manifest to \\`${IMAGE_DIGEST}\\`.
          - Rebuild the local runtime image and verify its CLI and bundled tools.

          ## Test plan
          - [x] Repository validation
          - [x] Compose configuration validation
          - [x] Kiro A/B runtime image build
          - [x] Runtime image size budget
          - [x] KiroCrew version and tool availability

          This PR was opened automatically by the \\`Update KiroCrew image\\` workflow.
          EOF
          )"
          fi
